receivers:
  nginx:
    endpoint: http://proxy-open-resty:8081/nginx_status
    collection_interval: 10s

  prometheus:
    config:
      scrape_configs:
        - job_name: 'openresty-custom'
          scrape_interval: 10s
          static_configs:
            - targets: ['proxy-open-resty:8081']

processors:
  batch:
  resource/nginx:
    attributes:
      - key: service.name
        value: "proxy-openresty"
        action: upsert

exporters:
  # Exporta métricas via gRPC para o OTel Collector Gateway
  otlp:
    endpoint: otel-collector:4317
    tls:
      insecure: true

  # Exibe os dados no console de logs do container para fins de depuração
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [nginx, prometheus]
      processors: [resource/nginx, batch]
      exporters: [otlp, debug]
