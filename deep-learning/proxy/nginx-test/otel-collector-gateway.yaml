receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      # Recebe o push OTLP HTTP/JSON enviado pelo otlp_exporter.lua do proxy
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # Exporta métricas no formato Prometheus para o Prometheus raspar
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  # Exibe os dados no console de logs do container para fins de depuração
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
