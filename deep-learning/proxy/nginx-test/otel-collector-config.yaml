receivers:
  # Receptor OTLP (exposto em gRPC na 4317 e HTTP na 4318)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Receptor Nginx para raspar o stub_status exposto pelo OpenResty
  nginx:
    endpoint: http://proxy-open-resty:8081/nginx_status
    collection_interval: 10s

processors:
  batch:
  resource/nginx:
    attributes:
      - key: service.name
        value: "proxy-openresty"
        action: upsert

exporters:
  # Exporta métricas no formato Prometheus
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: "nginx"
    resource_to_telemetry_conversion:
      enabled: true

  # Exibe os dados no console de logs do container para fins de depuração
  debug:
    verbosity: basic

service:
  pipelines:
    metrics/otlp:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    metrics/nginx:
      receivers: [nginx]
      processors: [resource/nginx, batch]
      exporters: [prometheus, debug]
